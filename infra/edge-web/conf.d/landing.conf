# www.makebelievestudio.app — the public landing page.
server {
    listen 80;
    server_name www.makebelievestudio.app makebelievestudio.app;

    root /srv/www/landing/current;
    index index.html;

    # `current` is a symlink the deploy swaps. nginx refuses to follow symlinks by
    # default and reports a bare 404, with nothing in the error log naming the
    # cause — this is the single most confusing failure in the whole setup.
    disable_symlinks off;

    include /etc/nginx/conf.d/security-headers-static.inc;

    location / {
        try_files $uri $uri/ =404;
    }

    # Deploys leave the previous releases on disk; nothing should be able to walk
    # into them through the web root.
    # Served by nginx rather than from the release, so it exists whether or not a
    # build remembered to include one.
    location = /robots.txt {
        add_header Content-Type text/plain always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 $mbs_robots;
    }

    location ~ /\. {
        deny all;
    }
}
