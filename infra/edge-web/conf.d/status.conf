# status-data.makebelievestudio.app — data and the gated detail view only.
#
# The PUBLIC status page now lives on Netlify, so that it survives this machine
# being down; a status page served by the thing it reports on cannot report the
# one failure it exists for. What stays here is what only this machine can
# provide:
#
#   /api/status.json          public, CORS-read by the Netlify page
#   /detail/                  staff — Cloudflare Access policy on `detail`
#   /detail/api/detail.json   same policy, same path prefix, deliberately
#
# `/` deliberately 404s. Serving the public status page here too would leave a
# second copy on a second hostname, quietly going stale and getting bookmarked.
server {
    listen 80;
    server_name status-data.makebelievestudio.app;

    root /srv/www/status/current;
    index index.html;
    disable_symlinks off;

    include /etc/nginx/conf.d/security-headers-static.inc;

    # The public page is not served from here. Only /detail/ and the JSON below.
    location = / {
        return 404;
    }

    location /detail/ {
        try_files $uri $uri/ =404;
    }

    # --- Collector output ----------------------------------------------------
    #
    # Served from /srv/status-data, NOT from the release directory. A deploy
    # replaces `current` wholesale; if the collector wrote into a release, its
    # output would vanish on the next deploy and the page would show "cannot reach
    # the collector" until the timer next fired.
    #
    # alias, not root: the URL path and the filesystem path deliberately differ.

    location = /api/status.json {
        alias /srv/status-data/public/status.json;
        default_type application/json;
        # add_header here replaces the inherited set rather than merging, so the
        # security headers have to be repeated.
        include /etc/nginx/conf.d/security-headers-static.inc;
        add_header Cache-Control "no-store" always;

        # Read cross-origin by the status page once it is hosted on Netlify.
        #
        # Named origins, not `*`. This file is world-readable by design, so a
        # wildcard would leak nothing extra — but `*` is also what someone copies
        # to the next endpoint, and the next one may not be public. The habit is
        # worth more than the header.
        #
        # No Allow-Credentials: this is public data and needs no cookie. Adding it
        # would forbid the named-origin form above anyway.
        # Two origins are legitimate: the Netlify site's own name, which is what
        # it serves under until DNS moves, and the final hostname. A map is the
        # only way to do this in nginx — add_header takes one value, and listing
        # both would send two headers, which browsers reject outright.
        add_header Access-Control-Allow-Origin $mbs_cors_origin always;
        add_header Vary "Origin" always;
    }

    location = /detail/api/detail.json {
        alias /srv/status-data/detail/detail.json;
        default_type application/json;
        include /etc/nginx/conf.d/security-headers-static.inc;
        add_header Cache-Control "no-store" always;
    }

    # Served by nginx rather than from the release, so it exists whether or not a
    # build remembered to include one.
    location = /robots.txt {
        add_header Content-Type text/plain always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 $mbs_robots;
    }

    location ~ /\. {
        deny all;
    }
}
