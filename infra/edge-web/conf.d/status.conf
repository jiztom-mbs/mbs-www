# status.makebelievestudio.app
#
#   /            public, up/down only
#   /detail/     staff — Cloudflare Access policy on `detail`
#
# nginx does NOT enforce that split. Access does, at the edge, before a request
# reaches this container. What nginx does is keep the two data files apart so a
# single Access policy on /detail* covers the page and its JSON together.
server {
    listen 80;
    server_name status.makebelievestudio.app;

    root /srv/www/status/current;
    index index.html;
    disable_symlinks off;

    include /etc/nginx/conf.d/security-headers-static.inc;

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Collector output ----------------------------------------------------
    #
    # Served from /srv/status-data, NOT from the release directory. A deploy
    # replaces `current` wholesale; if the collector wrote into a release, its
    # output would vanish on the next deploy and the page would show "cannot reach
    # the collector" until the timer next fired.
    #
    # alias, not root: the URL path and the filesystem path deliberately differ.

    location = /api/status.json {
        alias /srv/status-data/public/status.json;
        default_type application/json;
        # add_header here replaces the inherited set rather than merging, so the
        # security headers have to be repeated.
        include /etc/nginx/conf.d/security-headers-static.inc;
        add_header Cache-Control "no-store" always;
    }

    location = /detail/api/detail.json {
        alias /srv/status-data/detail/detail.json;
        default_type application/json;
        include /etc/nginx/conf.d/security-headers-static.inc;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. {
        deny all;
    }
}
