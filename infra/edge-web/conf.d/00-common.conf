# Loaded first (00-) so the default server and shared maps exist before any site.

# Cloudflare terminates TLS and cloudflared forwards over the Docker network, so
# every request arrives from a container IP. Without this, every log line and every
# rate limit would see the tunnel rather than the visitor.
set_real_ip_from 172.18.0.0/16;
real_ip_header CF-Connecting-IP;

# Long-cache immutable assets, never cache the HTML that points at them. Vite
# fingerprints filenames, so /assets/* can be cached hard; index.html must not be,
# or a deploy lands and nobody sees it until their cache expires.
map $uri $mbs_cache {
    default                       "no-store";
    "~^/assets/"                  "public, max-age=31536000, immutable";
    "~^/fonts/"                   "public, max-age=31536000, immutable";
    "~*\.(png|jpg|jpeg|svg|webp|ico)$" "public, max-age=604800";
}

# Which page origins may read the public status JSON.
#
# An allowlist, echoed back only on a match. The default is an empty string, which
# makes nginx omit the header entirely rather than send an invalid one — so an
# unlisted origin is refused by the browser, which is the intent.
#
# Both names are here on purpose: the Netlify site answers to its own
# *.netlify.app name as well as the custom domain, and it does so permanently, not
# just during the move.
map $http_origin $mbs_cors_origin {
    default                                  "";
    "https://status.makebelievestudio.app"   $http_origin;
    "https://mbs-status.netlify.app"         $http_origin;
}

# One robots.txt for every hostname on this server. Defined here rather than
# shipped in each release so it is served even before a site is deployed, and so a
# build that forgets it cannot expose the domain to crawling.
#
# `internal;` is deliberately NOT used — a crawler has to be able to fetch this.
map $host $mbs_robots {
    default "# Internal systems. Not for indexing.\nUser-agent: *\nDisallow: /\n";
}

# Unknown Host header: close the connection without replying.
#
# 444 rather than 404 because anything reaching here did not come through a
# configured tunnel hostname — it is a scanner hitting the IP or a stale DNS entry,
# and neither deserves a response that confirms a server is here.
server {
    listen 80 default_server;
    server_name _;

    # Exempted so the container healthcheck works before any site is deployed.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
