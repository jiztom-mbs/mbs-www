# warehouse.makebelievestudio.app — the Warehouse SPA.
server {
    listen 80;
    server_name warehouse.makebelievestudio.app;

    root /srv/www/warehouse/current;
    index index.html;
    disable_symlinks off;

    # Generated by scripts/emit-headers.mjs during the build and shipped inside the
    # release, so the CSP always matches the VITE_SUPABASE_URL the bundle was built
    # against. Hand-writing it here would drift the moment the backend moved — which
    # is exactly what happened when it was pinned to *.supabase.co.
    #
    # WILDCARD, and that matters. A literal include of a path inside a release is a
    # hard dependency on that release existing and being well-formed: before the
    # first Warehouse deploy, or after one that somehow lacked the file, nginx
    # refuses to start and takes the landing and status sites down with it. One
    # site's state must not decide whether the others serve. nginx accepts a
    # wildcard that matches nothing, so the blast radius becomes this vhost alone.
    #
    # The gap that leaves — a release serving with no CSP — is closed at deploy
    # time instead: deploy.sh refuses to publish a Warehouse build without this
    # file. That is the right place for it, because it fails one deploy rather than
    # every site.
    include /srv/www/warehouse/current/headers*.conf;
    add_header Cache-Control $mbs_cache always;

    location / {
        # SPA fallback. Without it every deep link — /tickets/<id>, /stock — 404s
        # on refresh, while working fine when reached by client-side navigation.
        try_files $uri $uri/ /index.html;
    }

    # nginx's bundled mime.types predates .webmanifest, so it went out as
    # application/octet-stream. Chrome installs anyway — it only needs the file
    # to parse as JSON — but the type is wrong, stricter clients are entitled to
    # refuse it, and an install that fails on one platform because of a header
    # nobody looked at is a bad afternoon.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control $mbs_cache always;
    }

    # The service worker must never be served stale. A cached worker keeps
    # serving a cached app and the update it exists to fetch never arrives —
    # and its scope is the whole site, so that state is self-sustaining.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Served by nginx rather than from the release, so it exists whether or not a
    # build remembered to include one.
    location = /robots.txt {
        add_header Content-Type text/plain always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 $mbs_robots;
    }

    location ~ /\. {
        deny all;
    }
}
